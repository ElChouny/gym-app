<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitTracker - Simulador de Entrenamiento</title>
    <!-- Enlace correcto al CSS en su carpeta -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body>

    <header class="header">
        <h1>🏋️ FitTracker</h1>
    </header>

    <main class="container">
        
        <!-- 1. PANTALLA DE PERFIL (Lo que antes era con prompt) -->
        <section id="seccion-perfil" class="card">
            <h2>Configurá tu Perfil</h2>
            <form id="form-perfil">
                <div class="input-group">
                    <label for="input-nombre">Tu Nombre:</label>
                    <input type="text" id="input-nombre" required placeholder="Ej: Tomas">
                </div>
                <div class="input-group">
                    <label for="input-peso-actual">Peso Actual (kg):</label>
                    <input type="number" id="input-peso-actual" required placeholder="Ej: 94">
                </div>
                <div class="input-group">
                    <label for="input-peso-deseado">Peso Objetivo (kg):</label>
                    <input type="number" id="input-peso-deseado" required placeholder="Ej: 90 o 97">
                </div>
                <div class="input-group">
                    <label for="input-frecuencia">Días de entreno por semana:</label>
                    <input type="number" id="input-frecuencia" required placeholder="Ej: 3">
                </div>
                <button type="submit" class="btn-primary">Ingresar al Simulador</button>
                <p id="mensaje-error-perfil" class="error-msg"></p>
            </form>
        </section>

        <!-- 2. PANTALLA PRINCIPAL DEL SIMULADOR (Oculta al inicio) -->
        <section id="seccion-app" class="oculto">
            
            <!-- Saludo dinámico con tus cálculos anteriores -->
            <div id="saludo-usuario" class="card destacado"></div>

            <div class="grid-layout">
                <!-- Columna Izquierda: Catálogo y Buscador -->
                <div class="card">
                    <h3>Catálogo de Ejercicios</h3>
                    <!-- Evento de teclado: Buscador -->
                    <input type="text" id="buscador-ejercicios" placeholder="Buscar por nombre o categoría (Push/Pull/Legs)...">
                    
                    <div id="catalogo-list" class="lista-items">
                        <!-- Acá se renderiza el catálogo dinámicamente -->
                    </div>
                </div>

                <!-- Columna Derecha: Registro y Sesión de hoy -->
                <div class="card">
                    <h3>Registrar Ejercicio</h3>
                    <form id="form-ejercicio">
                        <div class="input-group">
                            <input type="text" id="ej-nombre" required placeholder="Nombre del ejercicio">
                        </div>
                        <div class="input-group-row">
                            <input type="number" id="ej-series" required placeholder="Series" min="1">
                            <input type="number" id="ej-reps" required placeholder="Reps" min="1">
                            <input type="number" id="ej-peso" required placeholder="Peso (kg)" min="0">
                        </div>
                        <button type="submit" class="btn-secondary">+ Agregar a la sesión</button>
                    </form>

                    <h3 class="mt-20">Sesión de Hoy</h3>
                    <div id="sesion-list" class="lista-items">
                        <p class="text-muted">Todavía no agregaste ejercicios hoy.</p>
                    </div>
                    
                    <div class="resumen-volumen">
                        <h4>Volumen Total Movido: <span id="volumen-total">0</span> KG</h4>
                    </div>
                </div>
            </div>

        </section>
    </main>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <!-- Enlace correcto al JS en su carpeta -->
    <script src="js/main.js"></script>
</body>
</html>
